name: OmniRoute Token Provision
# Provision workflow: trigger a fresh run for live runner verification.

on:
  workflow_dispatch:
  push:
    branches: [omniroute-v3.8.50-integration]

jobs:
  provision:
    runs-on: [self-hosted, termux, ARM64]
    timeout-minutes: 15
    steps:
      - name: Checkout OmniRoute branch
        uses: actions/checkout@v4
        with:
          ref: omniroute-v3.8.50-integration

      - name: Verify job execution context
        run: |
          set -euo pipefail
          echo "OmniRoute Token Provision run #${{ github.run_number }}"
          echo "Job: ${{ github.job }}"
          echo "Runner: $RUNNER_NAME"
          echo "Runner OS: $RUNNER_OS"
          echo "Runner arch: $RUNNER_ARCH"
          test -n "${{ github.run_number }}"
          echo "Job execution marker: OK"

      - name: Verify local OmniRoute token endpoint
        env:
          PORT: "20128"
        run: |
          set -euo pipefail
          if ! curl -fsS --max-time 5 "http://127.0.0.1:$PORT/healthz" >/dev/null 2>&1; then
            echo "OmniRoute is not running on the Termux runner at port $PORT."
            echo "Start OmniRoute locally, then re-run this workflow."
            exit 1
          fi
          echo "OmniRoute health check: OK"

      - name: Verify internal service authentication configuration
        env:
          OMNIROUTE_INTERNAL_SERVICE_TOKEN: ${{ secrets.OMNIROUTE_INTERNAL_SERVICE_TOKEN }}
        run: |
          set -euo pipefail
          if [ -n "${OMNIROUTE_INTERNAL_SERVICE_TOKEN:-}" ]; then
            TOKEN_SOURCE="github-secret"
          elif [ -n "${RUNNER_OMNIROUTE_INTERNAL_SERVICE_TOKEN:-}" ]; then
            export OMNIROUTE_INTERNAL_SERVICE_TOKEN="$RUNNER_OMNIROUTE_INTERNAL_SERVICE_TOKEN"
            TOKEN_SOURCE="runner-environment"
          else
            echo "No OmniRoute internal service token is available."
            echo "Configure the GitHub secret OMNIROUTE_INTERNAL_SERVICE_TOKEN"
            echo "or export RUNNER_OMNIROUTE_INTERNAL_SERVICE_TOKEN in the self-hosted runner environment."
            exit 1
          fi

          status=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 10 \
            -X POST http://127.0.0.1:20128/api/keys \
            -H 'Content-Type: application/json' \
            -H "x-omniroute-internal-service-token: $OMNIROUTE_INTERNAL_SERVICE_TOKEN" \
            --data '{"name":"argus-token-auth-check","scopes":["chat"]}' || true)

          case "$status" in
            201) echo "Internal service authentication: OK (source: $TOKEN_SOURCE)" ;;
            401)
              echo "Internal service authentication rejected (source: $TOKEN_SOURCE)."
              echo "The supplied token does not match the running OmniRoute instance."
              exit 1 ;;
            *)
              echo "Unexpected /api/keys HTTP status: $status"
              exit 1 ;;
          esac

      - name: Create three OmniRoute tokens
        env:
          OMNIROUTE_INTERNAL_SERVICE_TOKEN: ${{ secrets.OMNIROUTE_INTERNAL_SERVICE_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${OMNIROUTE_INTERNAL_SERVICE_TOKEN:-}" ] && [ -n "${RUNNER_OMNIROUTE_INTERNAL_SERVICE_TOKEN:-}" ]; then
            export OMNIROUTE_INTERNAL_SERVICE_TOKEN="$RUNNER_OMNIROUTE_INTERNAL_SERVICE_TOKEN"
          fi
          if [ -z "${OMNIROUTE_INTERNAL_SERVICE_TOKEN:-}" ]; then
            echo "Internal service token is unavailable."
            exit 1
          fi
          BASE_DIR="$HOME/.omniroute"
          mkdir -p "$BASE_DIR"
          chmod 700 "$BASE_DIR"
          OUT="$BASE_DIR/tokens.json"
          TMP="$BASE_DIR/tokens.tmp.json"
          rm -f "$TMP"
          printf '[]' > "$TMP"
          chmod 600 "$TMP"
          for name in argus-chat-1 argus-chat-2 argus-chat-3; do
            response=$(curl -fsS --max-time 30 \
              -X POST http://127.0.0.1:20128/api/keys \
              -H 'Content-Type: application/json' \
              -H "x-omniroute-internal-service-token: $OMNIROUTE_INTERNAL_SERVICE_TOKEN" \
              --data "{\"name\":\"$name\",\"scopes\":[\"chat\"]}")
            node -e 'const x=JSON.parse(process.argv[1]); if(!x.key||!x.id||!String(x.key).startsWith("sk-")) process.exit(1);' "$response"
            node -e 'const fs=require("fs"); const x=JSON.parse(process.argv[1]); const p=process.argv[2]; const a=JSON.parse(fs.readFileSync(p,"utf8")); a.push({name:x.name,id:x.id,key:x.key}); fs.writeFileSync(p,JSON.stringify(a,null,2));' "$response" "$TMP"
          done
          mv "$TMP" "$OUT"
          chmod 600 "$OUT"
          echo "Created 3 OmniRoute tokens; values withheld."

      - name: Validate all three tokens
        run: |
          set -euo pipefail
          OUT="$HOME/.omniroute/tokens.json"
          node -e 'const fs=require("fs"); const a=JSON.parse(fs.readFileSync(process.argv[1],"utf8")); if(a.length!==3) process.exit(1); for(const x of a){if(!x.key.startsWith("sk-")) process.exit(2)} console.log("3 token records present; values withheld.");' "$OUT"
          while IFS= read -r key; do
            status=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 20 http://127.0.0.1:20128/v1/models -H "Authorization: Bearer $key")
            test "$status" = 200
          done < <(node -e 'for(const x of JSON.parse(require("fs").readFileSync(process.argv[1],"utf8"))) console.log(x.key)' "$OUT")
          echo "All 3 tokens validated successfully."

      - name: Final permissions check
        run: |
          stat -c '%A %n' "$HOME/.omniroute/tokens.json"
