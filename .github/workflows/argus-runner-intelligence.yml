name: Argus Runner Intelligence

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  runner-intelligence:
    name: Argus Runner Intelligence
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install intelligence tools
        shell: bash
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install \
            pytest \
            pytest-xdist \
            pytest-cov \
            psutil

      - name: Collect Hardware Intelligence
        shell: bash
        run: |
          set +e

          mkdir -p argus-intelligence

          python3 <<'PY'
          import json
          import os
          import platform
          import shutil
          import socket
          import subprocess
          import time
          from pathlib import Path

          def command(cmd, timeout=30):
              try:
                  result = subprocess.run(
                      cmd,
                      shell=True,
                      text=True,
                      stdout=subprocess.PIPE,
                      stderr=subprocess.STDOUT,
                      timeout=timeout
                  )

                  return {
                      "status": "success" if result.returncode == 0 else "failed",
                      "exit_code": result.returncode,
                      "output": result.stdout.strip()
                  }

              except Exception as e:
                  return {
                      "status": "failed",
                      "exit_code": -1,
                      "output": str(e)
                  }

          def clean(value):
              return value if value else None

          start = time.time()

          # --------------------------------------------------
          # RUNNER
          # --------------------------------------------------

          runner = {
              "os": os.environ.get("RUNNER_OS"),
              "architecture": os.environ.get("RUNNER_ARCH"),
              "environment": os.environ.get("RUNNER_ENVIRONMENT"),
              "name": os.environ.get("RUNNER_NAME"),
              "temp": os.environ.get("RUNNER_TEMP"),
              "tool_cache": os.environ.get("RUNNER_TOOL_CACHE"),
              "workspace": os.environ.get("GITHUB_WORKSPACE")
          }

          # --------------------------------------------------
          # CPU
          # --------------------------------------------------

          cpu = {
              "logical_cpus": os.cpu_count(),
              "physical_cores": None,
              "model": None,
              "architecture": platform.machine(),
              "cpu_info": command("lscpu")
          }

          try:
              import psutil

              cpu["physical_cores"] = psutil.cpu_count(logical=False)
              cpu["logical_cpus"] = psutil.cpu_count(logical=True)

          except Exception:
              pass

          cpu_model = command(
              "lscpu | grep -m1 'Model name:' | sed 's/^[^:]*:[[:space:]]*//'"
          )

          if cpu_model["status"] == "success":
              cpu["model"] = cpu_model["output"]

          # --------------------------------------------------
          # RAM
          # --------------------------------------------------

          memory = {
              "total_gb": None,
              "available_gb": None,
              "used_gb": None,
              "swap": command("free -h")
          }

          try:
              import psutil

              vm = psutil.virtual_memory()

              memory["total_gb"] = round(vm.total / 1024**3, 2)
              memory["available_gb"] = round(vm.available / 1024**3, 2)
              memory["used_gb"] = round(vm.used / 1024**3, 2)

          except Exception:
              pass

          # --------------------------------------------------
          # STORAGE / NVMe
          # --------------------------------------------------

          storage = {
              "filesystem": command("df -h"),
              "root_filesystem": command("df -h /"),
              "block_devices": command(
                  "lsblk -o NAME,MODEL,SIZE,TYPE,FSTYPE,MOUNTPOINT,ROTA"
              ),
              "nvme_devices": command(
                  "lsblk -d -o NAME,MODEL,SIZE,ROTA,TRAN | grep -i nvme"
              ),
              "mounts": command("findmnt")
          }

          nvme_check = command(
              "ls /dev/nvme* >/dev/null 2>&1"
          )

          storage["nvme_detected"] = nvme_check["status"] == "success"

          # --------------------------------------------------
          # INTERNET
          # --------------------------------------------------

          internet = {
              "dns_github": command("getent hosts github.com"),
              "github": command(
                  "curl -LIs --max-time 10 https://github.com | head -n 1"
              ),
              "pypi": command(
                  "curl -LIs --max-time 10 https://pypi.org | head -n 1"
              ),
              "github_api": command(
                  "curl -LIs --max-time 10 https://api.github.com | head -n 1"
              )
          }

          internet["connected"] = any(
              item["status"] == "success"
              for item in internet.values()
              if isinstance(item, dict)
          )

          # --------------------------------------------------
          # GPU
          # --------------------------------------------------

          gpu = {
              "nvidia_smi": command(
                  "nvidia-smi --query-gpu=name,memory.total,driver_version --format=csv,noheader"
              ),
              "pci_devices": command(
                  "lspci | grep -Ei 'vga|3d|display'"
              )
          }

          gpu["available"] = (
              gpu["nvidia_smi"]["status"] == "success"
              or gpu["pci_devices"]["status"] == "success"
              and bool(gpu["pci_devices"]["output"])
          )

          # --------------------------------------------------
          # PYTHON
          # --------------------------------------------------

          python_info = {
              "version": command("python3 --version"),
              "pip": command("python3 -m pip --version"),
              "executable": shutil.which("python3"),
              "implementation": platform.python_implementation()
          }

          # --------------------------------------------------
          # DOCKER
          # --------------------------------------------------

          docker = {
              "installed": shutil.which("docker") is not None,
              "version": command("docker --version"),
              "info": command("docker info")
          }

          # --------------------------------------------------
          # TOOLS
          # --------------------------------------------------

          tools = {}

          checks = {
              "pytest": "python3 -m pytest --version",
              "pytest-xdist": "python3 -m pip show pytest-xdist",
              "pytest-cov": "python3 -m pip show pytest-cov",
              "psutil": "python3 -m pip show psutil",
              "git": "git --version",
              "curl": "curl --version | head -n 1"
          }

          for name, cmd in checks.items():
              result = command(cmd)

              tools[name] = {
                  "status": result["status"],
                  "output": result["output"]
              }

          # --------------------------------------------------
          # GITHUB
          # --------------------------------------------------

          github = {
              "repository": os.environ.get("GITHUB_REPOSITORY"),
              "workflow": os.environ.get("GITHUB_WORKFLOW"),
              "run_id": os.environ.get("GITHUB_RUN_ID"),
              "run_number": os.environ.get("GITHUB_RUN_NUMBER"),
              "event_name": os.environ.get("GITHUB_EVENT_NAME"),
              "ref": os.environ.get("GITHUB_REF"),
              "ref_name": os.environ.get("GITHUB_REF_NAME"),
              "sha": os.environ.get("GITHUB_SHA"),
              "actor": os.environ.get("GITHUB_ACTOR")
          }

          # --------------------------------------------------
          # SYSTEM
          # --------------------------------------------------

          system = {
              "platform": platform.platform(),
              "system": platform.system(),
              "release": platform.release(),
              "version": platform.version(),
              "hostname": socket.gethostname(),
              "python": platform.python_version()
          }

          # --------------------------------------------------
          # RESOURCE EVALUATION
          # --------------------------------------------------

          total_ram = memory.get("total_gb") or 0
          logical_cpu = cpu.get("logical_cpus") or 0

          if total_ram >= 32:
              ram_rating = "excellent"
          elif total_ram >= 16:
              ram_rating = "good"
          elif total_ram >= 8:
              ram_rating = "acceptable"
          else:
              ram_rating = "limited"

          if logical_cpu >= 8:
              cpu_rating = "excellent"
          elif logical_cpu >= 4:
              cpu_rating = "good"
          elif logical_cpu >= 2:
              cpu_rating = "acceptable"
          else:
              cpu_rating = "limited"

          resource_evaluation = {
              "cpu_rating": cpu_rating,
              "ram_rating": ram_rating,
              "nvme_detected": storage["nvme_detected"],
              "internet_connected": internet["connected"],
              "docker_available": docker["installed"],
              "recommended_pytest_workers": max(1, logical_cpu - 1)
          }

          # --------------------------------------------------
          # FINAL REPORT
          # --------------------------------------------------

          intelligence = {
              "schema_version": "2.0",
              "generated_at_utc": time.strftime(
                  "%Y-%m-%dT%H:%M:%SZ",
                  time.gmtime()
              ),
              "runner": runner,
              "system": system,
              "cpu": cpu,
              "memory": memory,
              "storage": storage,
              "gpu": gpu,
              "internet": internet,
              "python": python_info,
              "docker": docker,
              "tools": tools,
              "github": github,
              "resource_evaluation": resource_evaluation,
              "execution": {
                  "duration_seconds": round(time.time() - start, 3)
              }
          }

          output = Path(
              "argus-intelligence/runner-intelligence.json"
          )

          output.write_text(
              json.dumps(
                  intelligence,
                  indent=2,
                  ensure_ascii=False
              ),
              encoding="utf-8"
          )

          print(json.dumps(
              intelligence,
              indent=2,
              ensure_ascii=False
          ))

          PY

      - name: Run pytest
        shell: bash
        run: |
          set +e

          python3 -m pytest -q \
            --disable-warnings \
            --junitxml=argus-intelligence/pytest-results.xml \
            2>&1 | tee argus-intelligence/pytest-output.txt

          echo "pytest_exit_code=${PIPESTATUS[0]}" \
            > argus-intelligence/pytest-status.txt

      - name: Test pytest-xdist
        shell: bash
        run: |
          set +e

          python3 -m pytest \
            -n auto \
            -q \
            --disable-warnings \
            2>&1 | tee argus-intelligence/pytest-xdist-output.txt

          echo "pytest_xdist_exit_code=${PIPESTATUS[0]}" \
            > argus-intelligence/pytest-xdist-status.txt

      - name: Show Argus Intelligence
        if: always()
        shell: bash
        run: |
          echo "========================================"
          echo "ARGUS RUNNER INTELLIGENCE"
          echo "========================================"

          find argus-intelligence \
            -maxdepth 2 \
            -type f \
            -print

          echo
          echo "========================================"
          echo "RUNNER REPORT"
          echo "========================================"

          if [ -f argus-intelligence/runner-intelligence.json ]; then
            cat argus-intelligence/runner-intelligence.json
          fi

      - name: Upload Argus Runner Intelligence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: argus-runner-intelligence
          path: argus-intelligence/
          if-no-files-found: warn
          retention-days: 30