name: OmniRoute Manual GitHub Runner

on:
  workflow_dispatch:
  push:
    branches:
      - omniroute-v3.8.50-integration
    paths:
      - 'omniroute/**'
      - '.github/workflows/omniroute-manual-runner.yml'

jobs:
  omniroute-github-runner:
    name: OmniRoute GitHub-hosted Ubuntu Runner
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: omniroute
    env:
      NODE_ENV: test
      JWT_SECRET: ci-only-jwt-secret
      API_KEY_SECRET: ci-only-api-key-secret
      INITIAL_PASSWORD: ci-only-password
      STORAGE_ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      PORT: 20128
      HOSTNAME: 127.0.0.1
      DATA_DIR: ${{ github.workspace }}/.omniroute-ci-data
      DISABLE_SQLITE_AUTO_BACKUP: 'true'
    steps:
      - name: Checkout OmniRoute branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - name: Setup Node 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: omniroute/package-lock.json
      - name: Verify OmniRoute build entrypoints
        shell: bash
        run: |
          set -euo pipefail
          for f in \
            scripts/build/build-next-isolated.mjs \
            scripts/build/assembleStandalone.mjs \
            scripts/build/backendOnlyPages.mjs \
            scripts/build/better-sqlite3-stub-flag.mjs \
            scripts/build/mitm-stub-flag.mjs \
            scripts/build/normalizeBasePath.mjs \
            scripts/build/dashboardEmbed.mjs; do
            test -f "$f"
            node --check "$f"
          done
          node -e "const p=require('./package.json'); if (!p.scripts?.build) throw new Error('package.json build script missing'); console.log('build:', p.scripts.build)"
      - name: Install OmniRoute dependencies
        run: npm install --ignore-scripts
      - name: Build OmniRoute
        run: npm run build
      - name: Verify build output
        shell: bash
        run: |
          set -euo pipefail
          BUILD_DIR="${NEXT_DIST_DIR:-.build/next}"
          test -d "$BUILD_DIR"
          test -d "$BUILD_DIR/standalone"
          echo "Verified standalone build output: $BUILD_DIR/standalone"
      - name: Start OmniRoute
        shell: bash
        run: |
          mkdir -p "$DATA_DIR"
          nohup npm run start > "$RUNNER_TEMP/omniroute.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/omniroute.pid"
      - name: Wait for health endpoint
        shell: bash
        run: |
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:20128/api/health; then echo; exit 0; fi
            sleep 2
          done
          cat "$RUNNER_TEMP/omniroute.log" || true
          exit 1
      - name: Verify providers endpoint
        run: curl -fsS http://127.0.0.1:20128/api/providers
      - name: Verify models endpoint
        run: curl -fsS http://127.0.0.1:20128/v1/models
      - name: Generate API key through OmniRoute API
        shell: bash
        run: |
          set -euo pipefail
          response=$(curl -fsS -X POST http://127.0.0.1:20128/api/keys \
            -H 'Content-Type: application/json' \
            --data '{"name":"github-ci-token","scopes":["chat"]}')
          key=$(printf '%s' "$response" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const j=JSON.parse(s);process.stdout.write(j.key||j.apiKey||'')})")
          test -n "$key"
          case "$key" in sk-*) ;; *) echo 'API key format is invalid'; exit 1;; esac
          echo 'Generated OmniRoute API key successfully (value not printed).'
          echo "OMNIROUTE_CI_API_KEY=$key" >> "$GITHUB_ENV"
      - name: Validate generated key on /v1/models
        run: curl -fsS http://127.0.0.1:20128/v1/models -H "Authorization: Bearer $OMNIROUTE_CI_API_KEY"
      - name: Confirm invalid token is rejected
        shell: bash
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:20128/v1/models -H 'Authorization: Bearer sk-ci-invalid-token')
          echo "HTTP status: $code"
          test "$code" = '401' || test "$code" = '403'
      - name: Verify home page
        run: curl -fsS http://127.0.0.1:20128/home -o /dev/null
      - name: Show sanitized server log on failure
        if: failure()
        run: cat "$RUNNER_TEMP/omniroute.log" || true
      - name: Upload logs
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: omniroute-github-runner-logs
          path: ${{ runner.temp }}/omniroute.log
          if-no-files-found: ignore
      - name: Stop OmniRoute
        if: always()
        shell: bash
        run: |
          if [ -f "$RUNNER_TEMP/omniroute.pid" ]; then kill "$(cat "$RUNNER_TEMP/omniroute.pid")" 2>/dev/null || true; fi
