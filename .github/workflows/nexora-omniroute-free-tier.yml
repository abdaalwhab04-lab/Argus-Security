name: NEXORA OmniRoute Free Tier

# workflow-registration-refresh-2026-10-06
# workflow-run-trigger-2026-10-23

"on":
  workflow_dispatch:
  push:
    branches:
      - main
      - omniroute-v3.8.50-integration

permissions:
  contents: read
  actions: read

jobs:
  nexora-free-tier:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout integration branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: omniroute-v3.8.50-integration
          lfs: true

      - name: Restore encrypted NEXORA persistent workspace
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          NEXORA_PERSISTENCE_KEY: ${{ secrets.NEXORA_PERSISTENCE_KEY }}
        run: |
          set -euo pipefail
          test -n "${NEXORA_PERSISTENCE_KEY:-}" || { echo "NEXORA_PERSISTENCE_SECRET_MISSING=1"; exit 1; }
          RESTORE_DIR="$RUNNER_TEMP/nexora-persistence-restore"
          mkdir -p "$RESTORE_DIR"
          FOUND=0
          while IFS= read -r RUN_ID; do
            [ -n "$RUN_ID" ] || continue
            [ "$RUN_ID" != "$GITHUB_RUN_ID" ] || continue
            rm -f "$RESTORE_DIR/persistent-workspace.ext4.enc"
            if gh run download "$RUN_ID" --name nexora-persistent-workspace-encrypted --dir "$RESTORE_DIR" >/dev/null 2>&1 &&
               [ -s "$RESTORE_DIR/persistent-workspace.ext4.enc" ]; then
              echo "NEXORA_ENCRYPTED_PERSISTENCE_ARTIFACT_FOUND=1"
              FOUND=1
              break
            fi
          done < <(gh run list --workflow nexora-omniroute-free-tier.yml --branch omniroute-v3.8.50-integration --status success --limit 20 --json databaseId --jq '.[].databaseId')
          if [ "$FOUND" = "1" ]; then
            openssl enc -d -aes-256-cbc -pbkdf2 -pass env:NEXORA_PERSISTENCE_KEY \
              -in "$RESTORE_DIR/persistent-workspace.ext4.enc" \
              -out nexora/persistent-workspace.ext4
            sudo e2fsck -fn nexora/persistent-workspace.ext4
            echo "NEXORA_PERSISTENT_WORKSPACE_DECRYPTED=1"
          else
            echo "NEXORA_PERSISTENT_WORKSPACE_NO_PRIOR_ARTIFACT=1"
            echo "NEXORA_PERSISTENT_WORKSPACE_WILL_INITIALIZE=1"
          fi

      - name: Run NEXORA OmniRoute Free Tier and Aider smoke
        run: bash nexora/scripts/omniroute-free-tier-smoke.sh

      - name: Persist small NEXORA runtime manifest only
        if: success()
        shell: bash
        env:
          NEXORA_PERSISTENCE_KEY: ${{ secrets.NEXORA_PERSISTENCE_KEY }}
        run: |
          set -euo pipefail
          ROOTFS="$PWD/nexora/rootfs"
          PERSIST_IMG="$PWD/nexora/persistent-workspace.ext4"
          PERSIST_MOUNT="$ROOTFS/persist"
          test -f "$PERSIST_IMG"
          sudo mkdir -p "$PERSIST_MOUNT"
          cleanup() {
            if mountpoint -q "$PERSIST_MOUNT"; then
              sudo umount "$PERSIST_MOUNT"
            fi
          }
          trap cleanup EXIT
          # The smoke script unmounts /persist on exit. Remount its image here
          # before reading runtime state; otherwise chroot sees the empty mountpoint.
          sudo mount -o loop "$PERSIST_IMG" "$PERSIST_MOUNT"
          sudo mountpoint -q "$PERSIST_MOUNT"

          VERSION="$(sudo chroot "$ROOTFS" /usr/bin/cat /persist/debian-workspace/software/omniroute/.nexora-omniroute-version)"
          test -n "$VERSION"
          sudo chroot "$ROOTFS" /usr/bin/test -f /persist/debian-workspace/source/omniroute/package.json
          MODEL="$(sudo chroot "$ROOTFS" /usr/bin/cat /persist/debian-workspace/data/omniroute/nexora-aider-model)"
          test -n "$MODEL"
          FREE_IDS="$(sudo chroot "$ROOTFS" /usr/bin/cat /tmp/omniroute-free-ids.json)"
          test -n "$FREE_IDS"

          {
            echo "NEXORA_PERSISTENCE_MODE=encrypted-github-actions-artifact"
            echo "NEXORA_ARCHIVE=nexora/debian/debian-12-generic-amd64.tar.xz"
            echo "NEXORA_ARCHIVE_SHA256=$(sha256sum nexora/debian/debian-12-generic-amd64.tar.xz | cut -d' ' -f1)"
            echo "NEXORA_PERSISTENT_WORKSPACE_SIZE=$(stat -c%s "$PERSIST_IMG")"
            echo "NEXORA_OMNIROUTE_VERSION=$VERSION"
            echo "NEXORA_FREE_ONBOARDING_IDS=$FREE_IDS"
            echo "NEXORA_FREE_CHAT_MODEL=$MODEL"
            echo "NEXORA_PERSISTENT_INSTALL_OK=1"
            echo "NEXORA_RUNTIME_MANIFEST_VALIDATED=1"
          } > nexora/nexora-runtime-manifest.env
          cleanup
          trap - EXIT
          test -n "${NEXORA_PERSISTENCE_KEY:-}" || { echo "NEXORA_PERSISTENCE_SECRET_MISSING=1"; exit 1; }
          openssl enc -aes-256-cbc -pbkdf2 -salt -pass env:NEXORA_PERSISTENCE_KEY \
            -in "$PERSIST_IMG" -out "$PERSIST_IMG.enc"
          test -s "$PERSIST_IMG.enc"
          rm -f "$PERSIST_IMG"
          ls -lh nexora/nexora-runtime-manifest.env "$PERSIST_IMG.enc"

      - name: Upload small NEXORA runtime manifest
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: nexora-runtime-manifest
          path: nexora/nexora-runtime-manifest.env
          if-no-files-found: error
          retention-days: 30

      - name: Upload encrypted NEXORA persistent workspace
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: nexora-persistent-workspace-encrypted
          path: nexora/persistent-workspace.ext4.enc
          if-no-files-found: error
          compression-level: 0
          retention-days: 90

      - name: Show diagnostics on failure
        if: failure()
        run: |
          sudo chroot nexora/rootfs /bin/cat /tmp/omniroute-nexora.log 2>/dev/null || true
          sudo chroot nexora/rootfs /bin/cat /tmp/omniroute-login.json 2>/dev/null || true
          sudo chroot nexora/rootfs /bin/cat /tmp/aider-nexora-smoke.log 2>/dev/null || true
