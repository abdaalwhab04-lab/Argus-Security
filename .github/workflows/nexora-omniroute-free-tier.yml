name: NEXORA OmniRoute Free Tier

# workflow-registration-refresh-2026-10-06
# workflow-run-trigger-2026-10-23

"on":
  workflow_dispatch:
  push:
    branches:
      - main
      - omniroute-v3.8.50-integration

permissions:
  contents: read

jobs:
  nexora-free-tier:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout integration branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: omniroute-v3.8.50-integration
          lfs: true

      - name: Run NEXORA OmniRoute Free Tier and Aider smoke
        run: bash nexora/scripts/omniroute-free-tier-smoke.sh

      - name: Persist small NEXORA runtime manifest only
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          ROOTFS="$PWD/nexora/rootfs"
          PERSIST_IMG="$PWD/nexora/persistent-workspace.ext4"
          PERSIST_MOUNT="$ROOTFS/persist"
          test -f "$PERSIST_IMG"
          sudo mkdir -p "$PERSIST_MOUNT"
          cleanup() {
            if mountpoint -q "$PERSIST_MOUNT"; then
              sudo umount "$PERSIST_MOUNT"
            fi
          }
          trap cleanup EXIT
          # The smoke script unmounts /persist on exit. Remount its image here
          # before reading runtime state; otherwise chroot sees the empty mountpoint.
          sudo mount -o loop "$PERSIST_IMG" "$PERSIST_MOUNT"
          sudo mountpoint -q "$PERSIST_MOUNT"

          VERSION="$(sudo chroot "$ROOTFS" /usr/bin/cat /persist/debian-workspace/software/omniroute/.nexora-omniroute-version)"
          test -n "$VERSION"
          sudo chroot "$ROOTFS" /usr/bin/test -f /persist/debian-workspace/source/omniroute/package.json
          MODEL="$(sudo chroot "$ROOTFS" /usr/bin/cat /persist/debian-workspace/data/omniroute/nexora-aider-model)"
          test -n "$MODEL"
          FREE_IDS="$(sudo chroot "$ROOTFS" /usr/bin/cat /tmp/omniroute-free-ids.json)"
          test -n "$FREE_IDS"

          {
            echo "NEXORA_PERSISTENCE_MODE=ephemeral-ci-image-rebuilt-from-repo"
            echo "NEXORA_ARCHIVE=nexora/debian/debian-12-generic-amd64.tar.xz"
            echo "NEXORA_ARCHIVE_SHA256=$(sha256sum nexora/debian/debian-12-generic-amd64.tar.xz | cut -d' ' -f1)"
            echo "NEXORA_PERSISTENT_WORKSPACE_SIZE=$(stat -c%s "$PERSIST_IMG")"
            echo "NEXORA_OMNIROUTE_VERSION=$VERSION"
            echo "NEXORA_FREE_ONBOARDING_IDS=$FREE_IDS"
            echo "NEXORA_FREE_CHAT_MODEL=$MODEL"
            echo "NEXORA_PERSISTENT_INSTALL_OK=1"
            echo "NEXORA_RUNTIME_MANIFEST_VALIDATED=1"
          } > nexora/nexora-runtime-manifest.env
          cleanup
          trap - EXIT
          rm -f "$PERSIST_IMG"
          ls -lh nexora/nexora-runtime-manifest.env

      - name: Upload small NEXORA runtime manifest
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: nexora-runtime-manifest
          path: nexora/nexora-runtime-manifest.env
          if-no-files-found: error
          retention-days: 30

      - name: Show diagnostics on failure
        if: failure()
        run: |
          sudo chroot nexora/rootfs /bin/cat /tmp/omniroute-nexora.log 2>/dev/null || true
          sudo chroot nexora/rootfs /bin/cat /tmp/omniroute-login.json 2>/dev/null || true
          sudo chroot nexora/rootfs /bin/cat /tmp/aider-nexora-smoke.log 2>/dev/null || true
