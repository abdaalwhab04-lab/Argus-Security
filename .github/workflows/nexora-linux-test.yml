name: Argus NEXORA Linux Test

on:
  workflow_dispatch:
  push:
    branches:
      - omniroute-v3.8.50-integration

permissions:
  contents: read

jobs:
  nexora:
    name: Build and boot NEXORA
    cache-mode: write
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bc bison flex libssl-dev libelf-dev libdw-dev cpio gzip xorriso grub-pc-bin grub-efi-amd64-bin grub-efi-amd64 mtools rsync busybox-static qemu-system-x86 debootstrap
      - name: Check host Docker
        run: |
          uname -m
          file /usr/bin/docker
          docker --version
          docker info
          echo NEXORA_HOST_DOCKER_OK
      - name: Restore Debian RootFS from repository-scoped Actions cache
        id: debian-rootfs-cache
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4
        with:
          path: nexora/rootfs
          key: nexora-debian-rootfs-v1-${{ runner.os }}-${{ hashFiles('nexora/scripts/build-rootfs.sh', 'nexora/config/termux-packages.txt', 'nexora/config/termux-python-packages.txt', 'nexora/config/termux-npm-global.txt', 'nexora/config/termux-mirror-policy.md') }}

      - name: Build RootFS only when Debian cache is missing
        if: steps.debian-rootfs-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          sudo bash nexora/scripts/build-rootfs.sh
          test -d nexora/rootfs
          echo "NEXORA_DEBIAN_ROOTFS_CACHE_MISS_BUILT"

      - name: Verify Debian RootFS persistence
        run: |
          set -u
          ROOTFS="nexora/rootfs"

          echo "=== NEXORA ROOTFS VALIDATION ==="
          echo "HOST_ARCH=$(uname -m)"
          file "$ROOTFS/usr/bin/docker" || true
          file "$ROOTFS/usr/local/lib/docker/cli-plugins/docker-compose" || true
          file "$ROOTFS/usr/local/lib/docker/cli-plugins/docker-buildx" || true

          for path in             "$ROOTFS/sbin/init"             "$ROOTFS/lib/systemd/systemd"             "$ROOTFS/usr/bin/docker"             "$ROOTFS/usr/local/bin/node"             "$ROOTFS/usr/local/bin/npm"             "$ROOTFS/usr/local/bin/pnpm"             "$ROOTFS/usr/local/bin/docker-compose"             "$ROOTFS/usr/local/bin/nexora-userspace-start.sh"             "$ROOTFS/usr/local/lib/docker/cli-plugins/docker-compose"             "$ROOTFS/usr/local/lib/docker/cli-plugins/docker-buildx"; do
            if [ -x "$path" ]; then
              echo "PRESENT_EXECUTABLE: $path"
            else
              echo "MISSING_EXECUTABLE: $path"
              exit 1
            fi
          done

          echo "=== ROOTFS DOCKER PLUGINS ==="
          ls -la "$ROOTFS/usr/local/lib/docker/cli-plugins/"
          echo "=== ROOTFS DOCKER VERSION (PLAIN CHROOT, SAME AS BUILD SCRIPT) ==="
          set +e
          sudo chroot "$ROOTFS" /usr/bin/docker --version
          rc=$?
          echo "DOCKER_VERSION_RC=$rc"
          if [ "$rc" -ne 0 ]; then exit "$rc"; fi

          echo "=== ROOTFS COMPOSE VERSION (PLAIN CHROOT) ==="
          sudo chroot "$ROOTFS" /usr/bin/docker compose version
          rc=$?
          echo "DOCKER_COMPOSE_RC=$rc"
          if [ "$rc" -ne 0 ]; then exit "$rc"; fi

          echo "=== ROOTFS BUILDX VERSION (PLAIN CHROOT) ==="
          sudo chroot "$ROOTFS" /usr/bin/docker buildx version
          rc=$?
          echo "DOCKER_BUILDX_RC=$rc"
          if [ "$rc" -ne 0 ]; then exit "$rc"; fi

          echo "=== ROOTFS TOOLCHAIN ==="
          sudo chroot "$ROOTFS" /usr/local/bin/node --version
          rc=$?
          echo "NODE_RC=$rc"
          if [ "$rc" -ne 0 ]; then exit "$rc"; fi
          sudo chroot "$ROOTFS" /usr/local/bin/npm --version
          rc=$?
          echo "NPM_RC=$rc"
          if [ "$rc" -ne 0 ]; then exit "$rc"; fi
          sudo chroot "$ROOTFS" /usr/local/bin/pnpm --version
          rc=$?
          echo "PNPM_RC=$rc"
          if [ "$rc" -ne 0 ]; then exit "$rc"; fi
          sudo chroot "$ROOTFS" /usr/local/bin/docker-compose version
          rc=$?
          echo "DOCKER_COMPOSE_WRAPPER_RC=$rc"
          if [ "$rc" -ne 0 ]; then exit "$rc"; fi

          echo "NEXORA_DEBIAN_ROOTFS_PERSISTENT_OK"
          if [ "${{ steps.debian-rootfs-cache.outputs.cache-hit }}" = "true" ]; then
            echo "NEXORA_DEBIAN_ROOTFS_CACHE_HIT"
          else
            echo "NEXORA_DEBIAN_ROOTFS_CACHE_WILL_BE_SAVED"
          fi

      - name: Verify Termux → Debian mirrored toolset
        run: |
          set -euo pipefail
          ROOTFS="nexora/rootfs"
          test -d "$ROOTFS"
          test -f "$ROOTFS/opt/nexora/manifests/termux-packages.txt"
          echo "=== VERIFY TERMUX → DEBIAN MIRROR ==="
          commands="bash bc clang cpio curl ffmpeg file fish flex gawk gh git jq lsof make nano nmap ssh openssl parallel patch perl php psql qemu-system-x86_64 redis-server rg rsync ruby rustc cargo strace sudo tar tmux tor tree unzip vim w3m wget xorriso zip cmake ninja tshark"
          for cmd in $commands; do
            if ! sudo chroot "$ROOTFS" sh -c "command -v '$cmd' >/dev/null 2>&1"; then
              echo "TERMUX_TO_DEBIAN_FAILED: missing $cmd"
              exit 1
            fi
          done
          sudo chroot "$ROOTFS" /usr/local/bin/node --version
          sudo chroot "$ROOTFS" /usr/bin/python3 --version
          sudo chroot "$ROOTFS" /usr/bin/env -i HOME=/root PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin /usr/local/lib/docker/cli-plugins/docker-compose version
          sudo chroot "$ROOTFS" /usr/bin/git --version
          echo "NEXORA_TERMUX_TO_DEBIAN_OK"

      - name: Build Kernel
        run: sudo bash nexora/scripts/build-kernel.sh
      - name: Build Initramfs
        run: sudo bash nexora/scripts/build-initramfs.sh
      - name: Build ISO
        run: sudo bash nexora/scripts/build-iso.sh
      - name: Verify artifacts
        run: |
          test -s nexora/build/linux-6.12.50/arch/x86/boot/bzImage
          test -s nexora/build/nexora-initramfs.cpio.gz
          test -s nexora/build/output/nexora.iso
          file nexora/build/linux-6.12.50/arch/x86/boot/bzImage
          file nexora/build/nexora-initramfs.cpio.gz
          file nexora/build/output/nexora.iso
          echo NEXORA_ARTIFACTS_OK
      - name: Boot NEXORA with QEMU
        run: |
          mkdir -p output
          set +e
          timeout 90s qemu-system-x86_64 -m 1536 -machine q35 -display none -serial stdio -cdrom nexora/build/output/nexora.iso -no-reboot 2>&1 | tee output/nexora-qemu-boot.log
          QEMU_RC=${PIPESTATUS[0]}
          set -e
          echo "QEMU_RC=${QEMU_RC}"
          grep -q "NEXORA_BOOT_OK" output/nexora-qemu-boot.log
          grep -q "NEXORA_DEBIAN_ROOTFS_FOUND" output/nexora-qemu-boot.log
          grep -q "NEXORA_DOCKER_STORAGE_OK" output/nexora-qemu-boot.log
          grep -q "NEXORA_DOCKER_OK" output/nexora-qemu-boot.log
          grep -q "NEXORA_DOCKER_CONTAINER_OK" output/nexora-qemu-boot.log
          grep -q "NEXORA_DEBIAN_USERSPACE_OK" output/nexora-qemu-boot.log
          echo NEXORA_QEMU_BOOT_OK
      - name: Upload NEXORA artifacts
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: nexora-build
          path: |
            nexora/build/output/nexora.iso
            nexora/build/linux-6.12.50/arch/x86/boot/bzImage
            nexora/build/nexora-initramfs.cpio.gz
            output/nexora-qemu-boot.log
          if-no-files-found: warn
