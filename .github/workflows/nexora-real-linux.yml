name: Argus NEXORA Linux Test

on:
  workflow_dispatch:
  push:
    branches:
      - omniroute-v3.8.50-integration
      - nexora-real-test

permissions:
  contents: read

jobs:
  argus-nexora:
    name: Argus + NEXORA Linux Environment
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Install NEXORA build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            bc \
            bison \
            flex \
            libssl-dev \
            libelf-dev \
            libdw-dev \
            cpio \
            gzip \
            xorriso \
            grub-pc-bin \
            grub-efi-amd64-bin \
            grub-efi-amd64 \
            mtools \
            rsync \
            busybox-static \
            qemu-system-x86 \
            debootstrap

      - name: Build NEXORA RootFS
        run: |
          echo "=== Build NEXORA RootFS ==="
          sudo bash nexora/scripts/build-rootfs.sh

      - name: Check QEMU
        run: |
          echo "=== QEMU ==="
          qemu-system-x86_64 --version
          command -v qemu-system-x86_64
          echo "NEXORA_QEMU_OK"

      - name: Show system information
        run: |
          echo "=== OS ==="
          uname -a
          cat /etc/os-release

          echo "=== CPU ==="
          nproc
          lscpu | head -30

          echo "=== Memory ==="
          free -h

          echo "=== Disk ==="
          df -h

      - name: Check NEXORA build tools
        run: |
          echo "=== Required tools ==="
          command -v gcc
          command -v make
          command -v bc
          command -v bison
          command -v flex
          command -v cpio
          command -v gzip
          command -v xorriso
          command -v grub-mkrescue
          command -v rsync
          command -v busybox

          echo "=== Tool check complete ==="
          echo "NEXORA_BUILD_TOOLS_OK"

      - name: Build NEXORA Kernel
        run: |
          echo "=== Build NEXORA Kernel ==="
          bash nexora/scripts/build-kernel.sh

      - name: Verify NEXORA Kernel
        run: |
          KERNEL_VERSION="${KERNEL_VERSION:-6.12.50}"
          KERNEL_IMAGE="nexora/build/linux-${KERNEL_VERSION}/arch/x86/boot/bzImage"

          echo "=== Verify Kernel Image ==="

          if [ ! -f "${KERNEL_IMAGE}" ]; then
            echo "ERROR: NEXORA kernel image not found:"
            echo "${KERNEL_IMAGE}"
            exit 1
          fi

          ls -lh "${KERNEL_IMAGE}"
          file "${KERNEL_IMAGE}"
          echo "NEXORA_KERNEL_OK"

      - name: Build NEXORA Initramfs
        run: |
          echo "=== Build NEXORA Initramfs ==="
          bash nexora/scripts/build-initramfs.sh

      - name: Verify NEXORA Initramfs
        run: |
          INITRAMFS_IMAGE="nexora/build/nexora-initramfs.cpio.gz"

          echo "=== Verify Initramfs Image ==="

          if [ ! -f "${INITRAMFS_IMAGE}" ]; then
            echo "ERROR: NEXORA initramfs image not found:"
            echo "${INITRAMFS_IMAGE}"
            exit 1
          fi

          ls -lh "${INITRAMFS_IMAGE}"
          file "${INITRAMFS_IMAGE}"
          echo "NEXORA_INITRAMFS_OK"

      - name: Build NEXORA ISO
        run: |
          echo "=== Build NEXORA ISO ==="
          sudo bash nexora/scripts/build-iso.sh

      - name: Verify NEXORA ISO
        run: |
          ISO_IMAGE="nexora/build/output/nexora.iso"

          echo "=== Verify NEXORA ISO ==="

          if [ ! -f "${ISO_IMAGE}" ]; then
            echo "ERROR: NEXORA ISO image not found:"
            echo "${ISO_IMAGE}"
            exit 1
          fi

          ls -lh "${ISO_IMAGE}"
          file "${ISO_IMAGE}"
          echo "NEXORA_ISO_OK"

      - name: Inspect NEXORA Initramfs
        run: |
          echo "=== NEXORA INITRAMFS INSPECTION ==="

          INITRAMFS_IMAGE="nexora/build/nexora-initramfs.cpio.gz"

          echo "=== IMAGE ==="
          ls -lh "${INITRAMFS_IMAGE}"
          file "${INITRAMFS_IMAGE}"

          echo "=== INITRAMFS GZIP TEST ==="
          gzip -t "${INITRAMFS_IMAGE}"
          echo "GZIP_OK"

          echo "=== COMPLETE INITRAMFS CONTENT ==="
          gzip -cd "${INITRAMFS_IMAGE}" | cpio -itv

          echo "=== INITRAMFS IMPORTANT FILES ==="
          gzip -cd "${INITRAMFS_IMAGE}" | \
            cpio -itv | \
            grep -E '(^|/)(init|bin/busybox|bin/sh)$' || true

          echo "=== EXTRACT INITRAMFS ==="

          rm -rf /tmp/nexora-initramfs-inspect
          mkdir -p /tmp/nexora-initramfs-inspect

          gzip -cd "${INITRAMFS_IMAGE}" | \
            cpio -idmu -D /tmp/nexora-initramfs-inspect

          echo "=== EXTRACTED ROOT ==="
          ls -la /tmp/nexora-initramfs-inspect

          echo "=== EXTRACTED BIN ==="
          ls -la /tmp/nexora-initramfs-inspect/bin || true

          echo "=== INIT DETAILS ==="

          if [ -e /tmp/nexora-initramfs-inspect/init ]; then
            echo "INIT_EXISTS=YES"
            ls -l /tmp/nexora-initramfs-inspect/init
            file /tmp/nexora-initramfs-inspect/init

            echo "=== INIT CONTENT ==="
            head -n 20 /tmp/nexora-initramfs-inspect/init
          else
            echo "INIT_EXISTS=NO"
            echo "ERROR: /init DOES NOT EXIST"
          fi

          echo "=== BUSYBOX DETAILS ==="

          if [ -e /tmp/nexora-initramfs-inspect/bin/busybox ]; then
            echo "BUSYBOX_EXISTS=YES"
            ls -l /tmp/nexora-initramfs-inspect/bin/busybox
            file /tmp/nexora-initramfs-inspect/bin/busybox

            echo "=== BUSYBOX LINK CHECK ==="
            ldd /tmp/nexora-initramfs-inspect/bin/busybox || true
          else
            echo "BUSYBOX_EXISTS=NO"
            echo "ERROR: /bin/busybox DOES NOT EXIST"
          fi

          echo "=== SHELL CHECK ==="

          if [ -e /tmp/nexora-initramfs-inspect/bin/sh ]; then
            ls -l /tmp/nexora-initramfs-inspect/bin/sh
            file /tmp/nexora-initramfs-inspect/bin/sh
          else
            echo "WARNING: /bin/sh DOES NOT EXIST"
          fi

          echo "NEXORA_INITRAMFS_INSPECT_DONE"

      - name: Build NEXORA persistent data disk
        run: |
          echo "=== Build NEXORA persistent data disk ==="
          sudo bash nexora/scripts/build-persistent-storage.sh
          sudo chown runner:runner nexora/build/persistent-data.img
          sudo chmod 600 nexora/build/persistent-data.img
          ls -lh nexora/build/persistent-data.img
          stat -c 'NEXORA_PERSISTENT_DISK_OWNER=%U:%G MODE=%a' nexora/build/persistent-data.img
          echo "NEXORA_PERSISTENT_DISK_READY"

      - name: Boot NEXORA ISO with QEMU
        run: |
          echo "=== NEXORA QEMU BOOT TEST ==="

          ISO_IMAGE="nexora/build/output/nexora.iso"
          PERSISTENT_DISK="nexora/build/persistent-data.img"
          BOOT_LOG="output/nexora-qemu-boot.log"

          mkdir -p output

          QMP_SOCKET="/tmp/nexora-qmp.sock"

          run_nexora_boot() {
            local LOG_FILE="$1"
            rm -f "${QMP_SOCKET}" "${LOG_FILE}"

            echo "=== Start NEXORA QEMU ==="
            qemu-system-x86_64 \
              -m 1024 \
              -machine q35 \
              -display none \
              -serial stdio \
              -cdrom "${ISO_IMAGE}" \
              -drive file="${PERSISTENT_DISK}",format=raw,if=virtio \
              -qmp "unix:${QMP_SOCKET},server=on,wait=off" \
              -no-reboot \
              > "${LOG_FILE}" 2>&1 &
            local QEMU_PID=$!

            echo "NEXORA_QEMU_PID=${QEMU_PID}"

            for _ in $(seq 1 80); do
              if grep -q "NEXORA_PERSISTENCE_INITIALIZED" "${LOG_FILE}" || grep -q "NEXORA_PERSISTENCE_RESTORED" "${LOG_FILE}"; then
                break
              fi
              if ! kill -0 "${QEMU_PID}" 2>/dev/null; then
                echo "ERROR: NEXORA QEMU exited before the persistence marker."
                cat "${LOG_FILE}"
                return 1
              fi
              sleep 1
            done

            echo "=== Request graceful guest shutdown through QEMU QMP ==="

            python3 - "${QMP_SOCKET}" <<'PY'
import json
import socket
import sys
import time

path = sys.argv[1]
deadline = time.time() + 10

while time.time() < deadline:
    sock = None
    try:
        sock = socket.socket(socket.AF_UNIX, socket.SOCK_STREAM)
        sock.settimeout(3)
        sock.connect(path)
        sock.recv(65536)
        sock.sendall((json.dumps({"execute": "qmp_capabilities"}) + "\r\n").encode())
        sock.recv(65536)
        sock.sendall((json.dumps({"execute": "system_powerdown"}) + "\r\n").encode())
        # QEMU may close the QMP socket immediately while shutting down.
        # Do not require a response to system_powerdown.
        sock.settimeout(1)
        try:
            sock.recv(65536)
        except (socket.timeout, ConnectionResetError, BrokenPipeError, OSError):
            pass
        sock.close()
        print("NEXORA_QMP_POWERDOWN_SENT")
        break
    except (FileNotFoundError, ConnectionRefusedError, TimeoutError, OSError):
        if sock is not None:
            try:
                sock.close()
            except OSError:
                pass
        time.sleep(0.25)
else:
    raise SystemExit("ERROR: unable to connect to NEXORA QMP socket")
PY

            for _ in $(seq 1 30); do
              if ! kill -0 "${QEMU_PID}" 2>/dev/null; then
                break
              fi
              sleep 1
            done

            if kill -0 "${QEMU_PID}" 2>/dev/null; then
              echo "WARNING: QEMU did not exit after guest powerdown; sending SIGTERM."
              kill -TERM "${QEMU_PID}" 2>/dev/null || true
              wait "${QEMU_PID}" 2>/dev/null || true
            else
              wait "${QEMU_PID}" 2>/dev/null || true
            fi

            sync
            echo "NEXORA_HOST_DISK_SYNC_DONE"
          }

          run_nexora_boot "${BOOT_LOG}"

          echo "=== Check first NEXORA boot markers ==="

          if grep -q "NEXORA_BOOT_OK" "${BOOT_LOG}" && grep -q "NEXORA_DEBIAN_ROOTFS_FOUND" "${BOOT_LOG}" && grep -q "NEXORA_PERSISTENT_STORAGE_OK" "${BOOT_LOG}" && grep -q "NEXORA_ROOTFS_SWITCH" "${BOOT_LOG}" && grep -q "NEXORA_DEBIAN_USERSPACE_OK" "${BOOT_LOG}" && grep -q "NEXORA_DOCKER_CONTAINER_OK" "${BOOT_LOG}" && grep -q "NEXORA_PERSISTENCE_INITIALIZED" "${BOOT_LOG}" && grep -q "NEXORA_QMP_POWERDOWN_SENT" "${BOOT_LOG}"; then
            echo "NEXORA_QEMU_BOOT_OK"
          else
            echo "ERROR: NEXORA first boot or graceful persistence test failed."
            cat "${BOOT_LOG}"
            exit 1
          fi

          echo "=== Reboot NEXORA with the same persistent disk ==="

          SECOND_BOOT_LOG="output/nexora-qemu-persistence-reboot.log"
          run_nexora_boot "${SECOND_BOOT_LOG}"

          if grep -q "NEXORA_PERSISTENCE_RESTORED" "${SECOND_BOOT_LOG}" && grep -q "NEXORA_DOCKER_CONTAINER_OK" "${SECOND_BOOT_LOG}" && grep -q "NEXORA_DEBIAN_USERSPACE_OK" "${SECOND_BOOT_LOG}" && grep -q "NEXORA_QMP_POWERDOWN_SENT" "${SECOND_BOOT_LOG}"; then
            echo "NEXORA_PERSISTENCE_REBOOT_OK"
          else
            echo "ERROR: persistent data did not survive the second boot."
            cat "${SECOND_BOOT_LOG}"
            exit 1
          fi
      # NEXORA ISO upload disabled to avoid GitHub Actions artifact quota.

      - name: Check Python
        run: |
          python3 --version
          python3 -m pip --version

      - name: Check Docker
        run: |
          docker --version
          docker info

      - name: Install Python dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install -r requirements.txt

      - name: Install test tools
        run: |
          python3 -m pip install pytest pytest-xdist pytest-cov

      - name: Test free LLM Router
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          echo "=== Free LLM Router ==="
          python3 TERMUX-SETUP/free-llm-api-stack/router.py "Reply with exactly: NEXORA_ROUTER_OK"
          echo "NEXORA_ROUTER_OK"

      - name: Check Argus configuration
        run: |
          python3 scripts/run_ai_audit.py --help

      - name: Run pytest
        run: |
          mkdir -p output
          pytest \
            -v \
            --tb=short \
            --junitxml=output/pytest-junit.xml \
            2>&1 | tee output/pytest.log

      - name: Check NEXORA test
        run: |
          echo "NEXORA workflow environment check"
          echo "NEXORA_LINUX_OK"

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        continue-on-error: true
        with:
          name: argus-nexora-test-results
          path: output/
          if-no-files-found: warn

# NEXORA trigger: validate BPF cgroup device support
# NEXORA Run #43 trigger: execute the latest persistence and graceful-shutdown validation
