name: Argus NEXORA Linux Test

on:
  workflow_dispatch:
  push:
    branches:
      - omniroute-v3.8.50-integration
      - nexora-real-test

permissions:
  contents: read

jobs:
  argus-nexora:
    name: Argus + NEXORA Linux Environment
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install NEXORA build tools
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            build-essential bc bison flex libssl-dev libelf-dev libdw-dev \
            cpio gzip xorriso grub-pc-bin grub-efi-amd64-bin grub-efi-amd64 \
            mtools rsync busybox-static qemu-system-x86 debootstrap

      - name: Show system information
        run: |
          set -euo pipefail
          uname -a
          cat /etc/os-release
          echo "CPU=$(nproc)"
          free -h
          df -h

      - name: Check NEXORA build tools
        run: |
          set -euo pipefail
          for tool in gcc make bc bison flex cpio gzip xorriso grub-mkrescue rsync busybox qemu-system-x86_64; do
            command -v "$tool"
          done
          qemu-system-x86_64 --version
          echo "NEXORA_BUILD_TOOLS_OK"

      - name: Build NEXORA RootFS
        run: |
          set -euo pipefail
          sudo bash nexora/scripts/build-rootfs.sh
          test -d nexora/rootfs
          echo "NEXORA_ROOTFS_BUILD_OK"

      - name: Build NEXORA Kernel
        run: |
          set -euo pipefail
          bash nexora/scripts/build-kernel.sh

      - name: Verify NEXORA Kernel
        run: |
          set -euo pipefail
          KERNEL_VERSION="${KERNEL_VERSION:-6.12.50}"
          KERNEL_IMAGE="nexora/build/linux-${KERNEL_VERSION}/arch/x86/boot/bzImage"
          test -f "${KERNEL_IMAGE}"
          ls -lh "${KERNEL_IMAGE}"
          file "${KERNEL_IMAGE}"
          echo "NEXORA_KERNEL_OK"

      - name: Build NEXORA Initramfs
        run: |
          set -euo pipefail
          bash nexora/scripts/build-initramfs.sh

      - name: Verify NEXORA Initramfs
        run: |
          set -euo pipefail
          INITRAMFS_IMAGE="nexora/build/nexora-initramfs.cpio.gz"
          test -f "${INITRAMFS_IMAGE}"
          gzip -t "${INITRAMFS_IMAGE}"
          ls -lh "${INITRAMFS_IMAGE}"
          echo "NEXORA_INITRAMFS_OK"

      - name: Build NEXORA ISO
        run: |
          set -euo pipefail
          sudo bash nexora/scripts/build-iso.sh

      - name: Verify NEXORA ISO
        run: |
          set -euo pipefail
          ISO_IMAGE="nexora/build/output/nexora.iso"
          test -f "${ISO_IMAGE}"
          ls -lh "${ISO_IMAGE}"
          file "${ISO_IMAGE}"
          echo "NEXORA_ISO_OK"

      - name: Inspect NEXORA Initramfs
        run: |
          set -euo pipefail
          INITRAMFS_IMAGE="nexora/build/nexora-initramfs.cpio.gz"
          gzip -cd "${INITRAMFS_IMAGE}" | cpio -t | grep -E '(^|/)(init|bin/busybox)(|$)'
          rm -rf /tmp/nexora-initramfs-inspect
          mkdir -p /tmp/nexora-initramfs-inspect
          gzip -cd "${INITRAMFS_IMAGE}" | cpio -idmu -D /tmp/nexora-initramfs-inspect
          test -f /tmp/nexora-initramfs-inspect/init
          test -e /tmp/nexora-initramfs-inspect/bin/busybox
          echo "NEXORA_INITRAMFS_INSPECT_DONE"

      - name: Build NEXORA persistent data disk
        run: |
          set -euo pipefail
          sudo bash nexora/scripts/build-persistent-storage.sh
          sudo chown runner:runner nexora/build/persistent-data.img
          sudo chmod 600 nexora/build/persistent-data.img
          test -f nexora/build/persistent-data.img
          stat -c 'NEXORA_PERSISTENT_DISK_OWNER=%U:%G MODE=%a' nexora/build/persistent-data.img
          echo "NEXORA_PERSISTENT_DISK_READY"

      - name: Boot NEXORA and verify Docker persistence
        shell: bash
        run: |
          set -euo pipefail

          ISO_IMAGE="nexora/build/output/nexora.iso"
          PERSISTENT_DISK="nexora/build/persistent-data.img"
          OUTPUT_DIR="output"
          QMP_SOCKET="/tmp/nexora-qmp.sock"
          mkdir -p "${OUTPUT_DIR}"

          run_nexora_boot() {
            local LOG_FILE="$1"
            rm -f "${QMP_SOCKET}" "${LOG_FILE}"

            qemu-system-x86_64 \
              -m 1024 \
              -machine q35 \
              -display none \
              -serial stdio \
              -cdrom "${ISO_IMAGE}" \
              -drive file="${PERSISTENT_DISK}",format=raw,if=virtio \
              -qmp "unix:${QMP_SOCKET},server=on,wait=off" \
              -no-reboot >"${LOG_FILE}" 2>&1 &
            local QEMU_PID=$!

            for _ in $(seq 1 90); do
              if grep -qE 'NEXORA_PERSISTENCE_INITIALIZED|NEXORA_PERSISTENCE_RESTORED' "${LOG_FILE}"; then
                break
              fi
              if ! kill -0 "${QEMU_PID}" 2>/dev/null; then
                cat "${LOG_FILE}"
                return 1
              fi
              sleep 1
            done

            if ! grep -qE 'NEXORA_PERSISTENCE_INITIALIZED|NEXORA_PERSISTENCE_RESTORED' "${LOG_FILE}"; then
              echo "ERROR: persistence marker not reached within 90 seconds"
              cat "${LOG_FILE}"
              kill -TERM "${QEMU_PID}" 2>/dev/null || true
              wait "${QEMU_PID}" 2>/dev/null || true
              return 1
            fi

            python3 - "${QMP_SOCKET}" <<'PY'
              import json, socket, sys, time
              path = sys.argv[1]
              deadline = time.time() + 10
              while time.time() < deadline:
                  sock = None
                  try:
                      sock = socket.socket(socket.AF_UNIX, socket.SOCK_STREAM)
                      sock.settimeout(3)
                      sock.connect(path)
                      sock.recv(65536)
                      sock.sendall((json.dumps({"execute":"qmp_capabilities"}) + "\r\n").encode())
                      sock.recv(65536)
                      sock.sendall((json.dumps({"execute":"system_powerdown"}) + "\r\n").encode())
                      print("NEXORA_QMP_POWERDOWN_SENT")
                      sock.close()
                      break
                  except (FileNotFoundError, ConnectionRefusedError, TimeoutError, OSError):
                      if sock:
                          try: sock.close()
                          except OSError: pass
                      time.sleep(0.25)
              else:
                  raise SystemExit("ERROR: unable to connect to NEXORA QMP socket")
          PY

            for _ in $(seq 1 30); do
              if ! kill -0 "${QEMU_PID}" 2>/dev/null; then
                break
              fi
              sleep 1
            done

            if kill -0 "${QEMU_PID}" 2>/dev/null; then
              echo "NEXORA_GRACEFUL_SHUTDOWN_FAILED"
              cat "${LOG_FILE}"
              kill -TERM "${QEMU_PID}" 2>/dev/null || true
              wait "${QEMU_PID}" 2>/dev/null || true
              return 1
            fi

            wait "${QEMU_PID}" 2>/dev/null || true
            sync
            echo "NEXORA_HOST_DISK_SYNC_DONE"
          }

          BOOT_LOG="${OUTPUT_DIR}/nexora-qemu-boot.log"
          run_nexora_boot "${BOOT_LOG}"

          grep -q "NEXORA_BOOT_OK" "${BOOT_LOG}"
          grep -q "NEXORA_DEBIAN_ROOTFS_FOUND" "${BOOT_LOG}"
          grep -q "NEXORA_PERSISTENT_STORAGE_OK" "${BOOT_LOG}"
          grep -q "NEXORA_ROOTFS_SWITCH" "${BOOT_LOG}"
          grep -q "NEXORA_DEBIAN_USERSPACE_OK" "${BOOT_LOG}"
          grep -q "NEXORA_DOCKER_CONTAINER_OK" "${BOOT_LOG}"
          grep -q "NEXORA_PERSISTENCE_INITIALIZED" "${BOOT_LOG}"
          grep -q "NEXORA_PERSISTENCE_SYNCED" "${BOOT_LOG}"
          grep -q "NEXORA_QMP_POWERDOWN_SENT" "${BOOT_LOG}"
          grep -q "NEXORA_HOST_DISK_SYNC_DONE" "${BOOT_LOG}"
          echo "NEXORA_QEMU_BOOT_OK"

          HOST_PERSIST_MOUNT="/tmp/nexora-persist-check"
          sudo mkdir -p "${HOST_PERSIST_MOUNT}"
          sudo mount -o loop,ro "${PERSISTENT_DISK}" "${HOST_PERSIST_MOUNT}"
          test -f "${HOST_PERSIST_MOUNT}/nexora-persistence-marker"
          echo "NEXORA_HOST_PERSISTENCE_MARKER_OK"
          sudo umount "${HOST_PERSIST_MOUNT}"

          SECOND_BOOT_LOG="${OUTPUT_DIR}/nexora-qemu-persistence-reboot.log"
          run_nexora_boot "${SECOND_BOOT_LOG}"
          grep -q "NEXORA_PERSISTENCE_RESTORED" "${SECOND_BOOT_LOG}"
          grep -q "NEXORA_DEBIAN_USERSPACE_OK" "${SECOND_BOOT_LOG}"
          grep -q "NEXORA_DOCKER_CONTAINER_OK" "${SECOND_BOOT_LOG}"
          grep -q "NEXORA_QMP_POWERDOWN_SENT" "${SECOND_BOOT_LOG}"
          echo "NEXORA_PERSISTENCE_REBOOT_OK"

      - name: Validate Argus Python test environment
        run: |
          set -euo pipefail
          python3 --version
          python3 -m pip --version
          python3 -m pip install --upgrade pip
          python3 -m pip install pytest pytest-xdist pytest-cov
          echo "NEXORA_ARGUS_TEST_ENV_OK"

      - name: Check Argus configuration
        run: |
          set -euo pipefail
          python3 scripts/run_ai_audit.py --help
          echo "NEXORA_ARGUS_CONFIG_OK"

      - name: Run targeted NEXORA/Argus tests
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p output
          if [ -d tests ]; then
            pytest -v --tb=short --junitxml=output/pytest-junit.xml 2>&1 | tee output/pytest.log
          else
            echo "No top-level tests directory; NEXORA runtime validation remains the required gate."
          fi
          echo "NEXORA_LINUX_OK"

      - name: Upload NEXORA test reports
        if: always()
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: argus-nexora-test-results
          path: output/
          if-no-files-found: warn
