name: NEXORA Actual Linux Build Validation

on:
  workflow_call:
  push:
    branches:
      - omniroute-v3.8.50-integration
  workflow_dispatch:

permissions:
  contents: read

jobs:
  nexora:
    name: Build Debian RootFS, Kernel, Initramfs and ISO
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout repository with Debian LFS archive
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          lfs: true

      - name: Validate source scripts and Debian archive
        shell: bash
        run: |
          set -euo pipefail
          for f in nexora/scripts/build-rootfs.sh nexora/scripts/build-kernel.sh nexora/scripts/build-initramfs.sh nexora/scripts/build-iso.sh nexora/scripts/build-persistent-storage.sh nexora/scripts/integrate-argus.sh; do
            test -s "$f"
            bash -n "$f"
          done
          test -s nexora/debian/debian-12-generic-amd64.tar.xz
          test -x nexora/rootfs/initramfs/init
          test -s nexora/config/kernel.conf
          echo "NEXORA_SOURCE_PREFLIGHT_OK"

      - name: Install Linux build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y build-essential bc bison flex libssl-dev libelf-dev libdw-dev cpio gzip xorriso grub-pc-bin grub-efi-amd64-bin grub-efi-amd64 mtools rsync busybox-static qemu-system-x86 debootstrap e2fsprogs git-lfs

      - name: Verify Debian archive and runner tools
        shell: bash
        run: |
          set -euo pipefail
          file nexora/debian/debian-12-generic-amd64.tar.xz
          command -v losetup
          command -v debootstrap
          qemu-system-x86_64 --version
          echo "NEXORA_BUILD_TOOLS_OK"

      - name: Build Debian RootFS from repository archive
        shell: bash
        run: |
          set -euo pipefail
          sudo bash nexora/scripts/build-rootfs.sh
          test -x nexora/rootfs/sbin/init
          test -x nexora/rootfs/usr/local/bin/aider
          test -x nexora/rootfs/usr/local/bin/nexora-omniroute-install.sh
          test -s nexora/rootfs/etc/systemd/system/nexora-omniroute.service
          echo "NEXORA_DEBIAN_ROOTFS_BUILD_OK"

      - name: Build Linux kernel
        shell: bash
        env:
          NEXORA_KERNEL_JOBS: "2"
        run: |
          set -euo pipefail
          bash nexora/scripts/build-kernel.sh
          version="${KERNEL_VERSION:-6.12.50}"
          test -s "nexora/build/linux-${version}/arch/x86/boot/bzImage"
          echo "NEXORA_KERNEL_BUILD_OK"

      - name: Normalize kernel artifact path
        shell: bash
        run: |
          set -euo pipefail
          version="${KERNEL_VERSION:-6.12.50}"
          legacy="nexora/build/linux-${version}"
          normalized="nexora/build/linux-${version}-clang"
          if [ -d "$legacy" ] && [ ! -e "$normalized" ]; then mv "$legacy" "$normalized"; fi
          test -s "$normalized/arch/x86/boot/bzImage"
          echo "NEXORA_KERNEL_PATH_OK"

      - name: Build initramfs and ISO
        shell: bash
        run: |
          set -euo pipefail
          bash nexora/scripts/build-initramfs.sh
          gzip -t nexora/build/nexora-initramfs.cpio.gz
          sudo bash nexora/scripts/build-iso.sh
          test -s nexora/build/output/nexora.iso
          file nexora/build/output/nexora.iso
          echo "NEXORA_ISO_BUILD_OK"

      - name: Verify persistent disk without formatting an existing image
        shell: bash
        run: |
          set -euo pipefail
          image="nexora/build/persistent-data.img"
          if [ -e "$image" ]; then
            echo "Existing disk found; preserving it without formatting."
          else
            sudo bash nexora/scripts/build-persistent-storage.sh
          fi
          test -s "$image"
          # Root-run build scripts may leave parent directories inaccessible to the runner.
          sudo chmod 0755 nexora nexora/build nexora/build/output
          sudo chmod 0644 "$image" nexora/build/output/nexora.iso
          test -x nexora/build && test -x nexora/build/output
          test -r "$image" && test -r nexora/build/output/nexora.iso
          file "$image"
          # Pre-seed the persistent ext4 image on the build host. Copying the
          # large npm dependency tree during systemd startup can exceed the
          # guest's boot timeout, so make the runtime durable before QEMU.
          mount_dir="$(mktemp -d)"
          cleanup_mount() { sudo umount "$mount_dir" 2>/dev/null || true; rmdir "$mount_dir" 2>/dev/null || true; }
          trap cleanup_mount EXIT
          sudo mount -o loop "$image" "$mount_dir"
          sudo mkdir -p "$mount_dir/debian-workspace/software" "$mount_dir/debian-workspace/source" "$mount_dir/debian-workspace/data"
          sudo rsync -a --delete nexora/rootfs/opt/nexora/debian-workspace/software/ "$mount_dir/debian-workspace/software/"
          sudo rsync -a --delete --exclude '.git/' --exclude 'node_modules/' --exclude '.next/' --exclude '.turbo/' --exclude '.cache/' --exclude 'coverage/' --exclude 'dist/' nexora/rootfs/opt/nexora/debian-workspace/source/ "$mount_dir/debian-workspace/source/"
          sudo chmod 0755 "$mount_dir/debian-workspace" "$mount_dir/debian-workspace/software" "$mount_dir/debian-workspace/source" "$mount_dir/debian-workspace/data"
          test -x "$mount_dir/debian-workspace/software/omniroute/node_modules/.bin/omniroute"
          test -f "$mount_dir/debian-workspace/software/omniroute/.nexora-omniroute-version"
          echo "NEXORA_PERSISTENT_WORKSPACE_PRESEEDED_OK"
          cleanup_mount
          trap - EXIT
          echo "NEXORA_PERSISTENT_DISK_CHECK_OK"

      - name: First boot and verify Debian userspace, Docker, OmniRoute and persistence
        shell: bash
        timeout-minutes: 6
        run: |
          set -euo pipefail
          mkdir -p output
          log="output/nexora-first-boot.log"
          set +e
          sudo timeout --signal=TERM 240s qemu-system-x86_64 \
            -m 4096 -smp 2 -machine pc -display none -serial stdio \
            -kernel "nexora/build/linux-${KERNEL_VERSION:-6.12.50}-clang/arch/x86/boot/bzImage" \
            -initrd nexora/build/nexora-initramfs.cpio.gz \
            -append "root=/dev/ram0 rw console=ttyS0,115200 systemd.mask=serial-getty@ttyS0.service" \
            -drive "file=nexora/build/output/nexora.iso,media=cdrom,if=ide,readonly=on" \
            -drive "file=nexora/build/persistent-data.img,format=raw,if=virtio" \
            -no-reboot >"$log" 2>&1
          rc=$?
          set -e
          if [ "$rc" -ne 0 ] && [ "$rc" -ne 124 ] && [ "$rc" -ne 143 ]; then cat "$log"; exit "$rc"; fi
          for marker in NEXORA_BOOT_OK NEXORA_DEBIAN_ROOTFS_FOUND NEXORA_PERSISTENT_STORAGE_OK NEXORA_ROOTFS_SWITCH NEXORA_DEBIAN_USERSPACE_OK NEXORA_DOCKER_CONTAINER_OK NEXORA_PERSISTENCE_INITIALIZED NEXORA_OMNIROUTE_OK; do
            grep -q "$marker" "$log" || { cat "$log"; echo "NEXORA_REQUIRED_BOOT_MARKER_MISSING=$marker"; exit 1; }
          done
          echo 'NEXORA_FIRST_BOOT_FULL_STACK_OK'

      - name: Reboot and prove persistent workspace survives
        shell: bash
        timeout-minutes: 6
        run: |
          set -euo pipefail
          log="output/nexora-second-boot.log"
          set +e
          sudo timeout --signal=TERM 240s qemu-system-x86_64 \
            -m 4096 -smp 2 -machine pc -display none -serial stdio \
            -kernel "nexora/build/linux-${KERNEL_VERSION:-6.12.50}-clang/arch/x86/boot/bzImage" \
            -initrd nexora/build/nexora-initramfs.cpio.gz \
            -append "root=/dev/ram0 rw console=ttyS0,115200 systemd.mask=serial-getty@ttyS0.service" \
            -drive "file=nexora/build/output/nexora.iso,media=cdrom,if=ide,readonly=on" \
            -drive "file=nexora/build/persistent-data.img,format=raw,if=virtio" \
            -no-reboot >"$log" 2>&1
          rc=$?
          set -e
          if [ "$rc" -ne 0 ] && [ "$rc" -ne 124 ] && [ "$rc" -ne 143 ]; then cat "$log"; exit "$rc"; fi
          for marker in NEXORA_PERSISTENT_STORAGE_OK NEXORA_ROOTFS_SWITCH NEXORA_PERSISTENCE_RESTORED NEXORA_DEBIAN_USERSPACE_OK NEXORA_DOCKER_CONTAINER_OK NEXORA_OMNIROUTE_OK; do
            grep -q "$marker" "$log" || { cat "$log"; echo "NEXORA_PERSISTENCE_REBOOT_MARKER_MISSING=$marker"; exit 1; }
          done
          echo 'NEXORA_PERSISTENCE_REBOOT_OK'

      - name: Upload NEXORA boot diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: nexora-full-boot-diagnostics-${{ github.run_id }}
          path: output/nexora-*-boot.log
          if-no-files-found: ignore
          retention-days: 7
