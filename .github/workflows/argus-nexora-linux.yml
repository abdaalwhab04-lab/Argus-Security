name: Argus NEXORA Linux Test

on:
  workflow_dispatch:
  push:
    branches:
      - nexora-real-test

permissions:
  contents: read

jobs:
  argus-nexora:
    name: Argus + NEXORA Linux Environment
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Install NEXORA build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            bc \
            bison \
            flex \
            libssl-dev \
            libelf-dev \
            libdw-dev \
            cpio \
            gzip \
            xorriso \
            grub-pc-bin \
            grub-efi-amd64-bin \
            grub-efi-amd64 \
            mtools \
            rsync \
            busybox

      - name: Show system information
        run: |
          echo "=== OS ==="
          uname -a
          cat /etc/os-release

          echo "=== CPU ==="
          nproc
          lscpu | head -30

          echo "=== Memory ==="
          free -h

          echo "=== Disk ==="
          df -h

      - name: Check NEXORA build tools
        run: |
          echo "=== Required tools ==="
          command -v gcc
          command -v make
          command -v bc
          command -v bison
          command -v flex
          command -v cpio
          command -v gzip
          command -v xorriso
          command -v grub-mkrescue
          command -v rsync
          command -v busybox

          echo "=== Tool check complete ==="
          echo "NEXORA_BUILD_TOOLS_OK"

      - name: Build NEXORA Kernel
        run: |
          echo "=== Build NEXORA Kernel ==="
          bash nexora/scripts/build-kernel.sh

      - name: Verify NEXORA Kernel
        run: |
          KERNEL_VERSION="${KERNEL_VERSION:-6.12.50}"
          KERNEL_IMAGE="nexora/build/linux-${KERNEL_VERSION}/arch/x86/boot/bzImage"

          echo "=== Verify Kernel Image ==="
          if [ ! -f "${KERNEL_IMAGE}" ]; then
            echo "ERROR: NEXORA kernel image not found:"
            echo "${KERNEL_IMAGE}"
            exit 1
          fi

          ls -lh "${KERNEL_IMAGE}"
          file "${KERNEL_IMAGE}"
          echo "NEXORA_KERNEL_OK"

      - name: Check Python
        run: |
          python3 --version
          python3 -m pip --version

      - name: Check Docker
        run: |
          docker --version
          docker info

      - name: Install Python dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install -r requirements.txt

      - name: Install test tools
        run: |
          python3 -m pip install pytest pytest-xdist pytest-cov

      - name: Check Argus configuration
        run: |
          python3 scripts/run_ai_audit.py --help

      - name: Run pytest
        run: |
          mkdir -p output
          pytest \
            -v \
            --tb=short \
            --junitxml=output/pytest-junit.xml \
            2>&1 | tee output/pytest.log

      - name: Check NEXORA test
        run: |
          echo "NEXORA workflow environment check"
          echo "NEXORA_LINUX_OK"

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: argus-nexora-test-results
          path: output/
          if-no-files-found: warn
